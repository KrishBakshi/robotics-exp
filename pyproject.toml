[project]
name = "robotics-exp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Krish Bakshi" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.1.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "mlx-vlm>=0.7.10",
    "open3d>=0.20.0",
    "opencv-python>=5.0.0.93",
    "python-dotenv>=1.2.4",
    "torch==2.13.*",
    "torchvision>=0.28.0",
    "transformers[torch]>=5.20.2",
]

[project.scripts]
robotics-exp = "robotics_exp:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
